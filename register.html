<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SÜDWESTBANK account registration.">
  <title>Register | SÜDWESTBANK</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header" id="global-header"></header>
  <main class="registration-page">
    <div class="registration-container">
      <section class="registration-card" aria-labelledby="registration-title">
        <p class="registration-eyebrow">SÜDWESTBANK</p>
        <h1 id="registration-title">Account Registration</h1>

        <svg class="registration-icon-defs" xmlns="http://w3.org" aria-hidden="true">
          <symbol id="reg-icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></symbol>
          <symbol id="reg-icon-pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.3"/></symbol>
          <symbol id="reg-icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
          <symbol id="reg-icon-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="1"/><path d="M8 7V4h8v3M3 12h18M10 12v2h4v-2"/></symbol>
          <symbol id="reg-icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m4 7 8 6 8-6"/></symbol>
          <symbol id="reg-icon-phone" viewBox="0 0 24 24"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a14 14 0 0 1-8-8l2-2-2-5Z"/></symbol>
          <symbol id="reg-icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h2m3 0h2m-7 3h2"/></symbol>
          <symbol id="reg-icon-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9m-3 3 3 3m-6 0 2 2"/></symbol>
          <symbol id="reg-icon-tag" viewBox="0 0 24 24"><path d="M20 13 12 21 3 12V4h8l9 9Z"/><circle cx="7.5" cy="8" r="1"/></symbol>
          <symbol id="reg-icon-currency" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9h1m10 6h1"/></symbol>
          <symbol id="reg-icon-camera" viewBox="0 0 24 24"><path d="M4 7h4l2-2h4l2 2h4v12H4Z"/><circle cx="12" cy="13" r="3.5"/></symbol>
          <symbol id="reg-icon-building" viewBox="0 0 24 24"><path d="M4 21V5l8-3 8 3v16M2 21h20M8 8h1m6 0h1M8 12h1m6 0h1m-7 9v-4h6v4"/></symbol>
        </svg>

        <form id="registration-form" class="registration-form" enctype="multipart/form-data">
          <fieldset>
            <legend>Applicant Personal Information</legend>
            <div class="registration-field">
              <label for="applicant-first-name">First Name</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-user"></use></svg></span><input id="applicant-first-name" name="first_name" type="text" placeholder="Enter First Name" autocomplete="given-name" required></div>
            </div>
            <div class="registration-field">
              <label for="applicant-last-name">Last Name</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-user"></use></svg></span><input id="applicant-last-name" name="last_name" type="text" placeholder="Enter Last Name" autocomplete="family-name" required></div>
            </div>
            <div class="registration-field">
              <label for="applicant-address">Address</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-pin"></use></svg></span><input id="applicant-address" name="address" type="text" placeholder="Enter Address" autocomplete="street-address" required></div>
            </div>
            <div class="registration-field">
              <label for="applicant-city">City</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-pin"></use></svg></span><input id="applicant-city" name="city" type="text" placeholder="City" autocomplete="address-level2" required></div>
            </div>
            <div class="registration-field">
              <label for="applicant-state">State</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-pin"></use></svg></span><input id="applicant-state" name="state" type="text" placeholder="State" autocomplete="address-level1" required></div>
            </div>
            <div class="registration-field">
              <label for="applicant-zipcode">Zipcode</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-pin"></use></svg></span><input id="applicant-zipcode" name="zipcode" type="text" placeholder="Zipcode" autocomplete="postal-code" required></div>
            </div>
            <div class="registration-field">
              <label for="applicant-nationality">Nationality</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-globe"></use></svg></span><select id="applicant-nationality" name="nationality" required>
                <option value="" selected disabled>--Select Country--</option><option>Germany</option><option>Austria</option><option>Switzerland</option><option>France</option><option>Italy</option><option>Spain</option><option>United Kingdom</option><option>United States</option><option>Canada</option><option>Australia</option><option>Other</option>
              </select></div>
            </div>
            <div class="registration-field">
              <label for="applicant-occupation">Occupation</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-tag"></use></svg></span><input id="applicant-occupation" name="occupation" type="text" placeholder="Occupation" autocomplete="organization-title" required></div>
            </div>
            <div class="registration-field">
              <label for="applicant-email">Email</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-mail"></use></svg></span><input id="applicant-email" name="email" type="email" placeholder="Email" autocomplete="email" required></div>
            </div>
            <div class="registration-field">
              <label for="applicant-phone">Phone</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-phone"></use></svg></span><input id="applicant-phone" name="phone" type="tel" placeholder="Telephone" autocomplete="tel" required></div>
            </div>
            <div class="registration-field">
              <label for="applicant-dob">Date of Birth</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-calendar"></use></svg></span><input id="applicant-dob" name="dob" type="date" autocomplete="bday" required></div>
            </div>
            <div class="registration-field">
              <label for="applicant-gender">Gender</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-user"></use></svg></span><select id="applicant-gender" name="gender" required>
                <option value="" selected disabled>Select Gender</option><option>Male</option><option>Female</option><option>Other</option>
              </select></div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Security &amp; Account Preferences</legend>
            <div class="registration-field">
              <label for="applicant-password">Password</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-key"></use></svg></span><input id="applicant-password" name="password" type="password" placeholder="Enter Password" autocomplete="new-password" required></div>
            </div>
            <div class="registration-field">
              <label for="applicant-confirm-password">Confirm Password</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-key"></use></svg></span><input id="applicant-confirm-password" name="confirm_password" type="password" placeholder="Confirm Password" autocomplete="new-password" required></div>
            </div>
            <div class="registration-field">
              <label for="applicant-marital-status">Marital Status</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-tag"></use></svg></span><select id="applicant-marital-status" name="marital_status" required>
                <option value="" selected disabled>Marital Status</option><option>Single</option><option>Married</option><option>Divorced</option><option>Widowed</option>
              </select></div>
            </div>
            <div class="registration-field">
              <label for="account-type">Account Type</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-briefcase"></use></svg></span><select id="account-type" name="account_type" required>
                <option value="" selected disabled>Account Type</option><option value="GiroPrivat">GiroPrivat (Checking Account)</option><option value="RentaAnlage">RentaAnlage (Fixed Deposit)</option><option value="private-banking">Private Banking Account</option><option value="business">Unternehmenskunden (Business Account)</option>
              </select></div>
            </div>
            <div class="registration-field">
              <label for="preferred-currency">Choose Preferred Currency</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-currency"></use></svg></span><select id="preferred-currency" name="currency" required>
                <option value="" selected disabled>Choose Preferred Currency</option><option value="EUR">EUR (€)</option><option value="USD">USD ($)</option><option value="GBP">GBP (£)</option><option value="CHF">CHF</option>
              </select></div>
            </div>
            <div class="registration-field">
              <label for="passport-photograph">Passport Photograph</label>
              <div class="registration-input registration-file-input-group">
                <span class="registration-addon"><svg><use href="#reg-icon-camera"></use></svg></span>
                <label class="registration-file-button" for="passport-photograph">Browse...</label>
                <input class="registration-file-input" id="passport-photograph" name="passport" type="file" accept="image/*">
                <span class="registration-file-name" id="passport-file-name">No file selected</span>
              </div>
              <div class="registration-photo-preview" id="passport-preview" hidden>
                <img id="passport-preview-image" alt="Selected passport photograph preview">
                <span id="passport-preview-label"></span>
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Next of Kin Information</legend>
            <div class="registration-field">
              <label for="kin-first-name">First Name</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-user"></use></svg></span><input id="kin-first-name" name="kin_first_name" type="text" placeholder="Enter First Name" required></div>
            </div>
            <div class="registration-field">
              <label for="kin-last-name">Last Name</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-user"></use></svg></span><input id="kin-last-name" name="kin_last_name" type="text" placeholder="Enter Last Name" required></div>
            </div>
            <div class="registration-field">
              <label for="kin-gender">Gender</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-user"></use></svg></span><select id="kin-gender" name="kin_gender" required>
                <option value="" selected disabled>Select Gender</option><option>Male</option><option>Female</option><option>Other</option>
              </select></div>
            </div>
            <div class="registration-field">
              <label for="kin-marital-status">Marital Status</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-tag"></use></svg></span><select id="kin-marital-status" name="kin_marital_status" required>
                <option value="" selected disabled>Marital Status</option><option>Single</option><option>Married</option><option>Divorced</option><option>Widowed</option>
              </select></div>
            </div>
            <div class="registration-field">
              <label for="kin-phone">Phone</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-user"></use></svg></span><input id="kin-phone" name="kin_phone" type="tel" placeholder="Enter Phone" required></div>
            </div>
            <div class="registration-field">
              <label for="kin-email">Email</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-mail"></use></svg></span><input id="kin-email" name="kin_email" type="email" placeholder="Enter Email" required></div>
            </div>
            <div class="registration-field">
              <label for="kin-address">Address</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-building"></use></svg></span><input id="kin-address" name="kin_address" type="text" placeholder="Enter Address" required></div>
            </div>
            <div class="registration-field">
              <label for="kin-state">State</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-pin"></use></svg></span><input id="kin-state" name="kin_state" type="text" placeholder="Enter State" required></div>
            </div>
            <div class="registration-field">
              <label for="kin-city">City</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-pin"></use></svg></span><input id="kin-city" name="kin_city" type="text" placeholder="Enter City" required></div>
            </div>
            <div class="registration-field">
              <label for="kin-nationality">Nationality</label>
              <div class="registration-input"><span class="registration-addon"><svg><use href="#reg-icon-globe"></use></svg></span><select id="kin-nationality" name="kin_nationality" required>
                <option value="" selected disabled>--Select Country--</option><option>Germany</option><option>Austria</option><option>Switzerland</option><option>France</option><option>Italy</option><option>Spain</option><option>United Kingdom</option><option>United States</option><option>Canada</option><option>Australia</option><option>Other</option>
              </select></div>
            </div>
          </fieldset>

          <div class="registration-submit">
            <button class="registration-submit-button" type="submit">Submit</button>
            <p class="registration-signin">Have an account already? <a href="online-banking.html">Sign in</a></p>
          </div>
          <p class="registration-status" id="registration-status" role="status" aria-live="polite"></p>
        </form>
      </section>
    </div>
  </main>
  <footer class="site-footer" id="global-footer"></footer>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registration-form');
      const statusEl = document.getElementById('registration-status');
      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(form);
        const pw = formData.get('password');
        const cpw = formData.get('confirm_password');

        if (pw !== cpw) {
          alert('Passwords do not match.');
          return;
        }

        statusEl.textContent = 'Creating account...';
        try {
          const res = await fetch('/api/register', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Registration failed.');

          localStorage.setItem('swb_token', data.token);
          localStorage.setItem('isLoggedIn', 'true');
          localStorage.setItem('loggedIn', 'true');
          if (data.user) {
            localStorage.setItem('swb_user', JSON.stringify(data.user));
            localStorage.setItem('currentUser', JSON.stringify(data.user));
          }

          statusEl.style.color = '#0b6e4f';
          statusEl.style.fontWeight = '700';
          statusEl.textContent = 'Sign up successful! Redirecting to your dashboard...';

          alert(
            `Sign up successful!\n\n` +
            `Account Number: ${data.user.account_number}\n` +
            `IBAN: ${data.user.iban}\n\n` +
            `Click OK to open your Online-Banking Dashboard.`
          );

          window.location.href = 'dashboard.html';
        } catch (err) {
          statusEl.style.color = '#b00020';
          statusEl.textContent = err.message;
          alert(err.message);
        }
      });
    });
  </script>
</body>
</html>
