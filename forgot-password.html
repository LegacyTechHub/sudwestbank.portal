<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Demo für die Wiederherstellung des Online-Banking-Zugangs.">
  <title>Zugangsdaten vergessen | SÜDWESTBANK</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <header class="site-header" id="global-header"></header>
  <main class="portal-page portal-recovery-page">
    <div class="portal-container">
      <section class="portal-card portal-recovery-card" aria-labelledby="recovery-title">
        <p class="portal-eyebrow">Online-Banking</p>
        <h1 id="recovery-title">Zugangsdaten wiederherstellen</h1>
        <p class="portal-intro">Geben Sie Ihre Zugangsdaten ein, um einen Rücksetzlink anzufordern.</p>
        <div class="portal-demo-notice" role="note">
          Demo only — dies ist kein offizieller Banking-Dienst. Verwenden Sie keine echten Kontodaten.
          Es werden keine Daten gesendet oder gespeichert.
        </div>
        <form class="portal-form" id="recovery-form" novalidate>
          <div class="portal-field">
            <label for="recovery-account">Verfügernummer / Account Number</label>
            <div class="portal-input-group">
              <span class="portal-input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
              </span>
              <input id="recovery-account" name="accountNumber" type="text" inputmode="numeric" autocomplete="off" placeholder="Verfügernummer / Account Number" required>
            </div>
          </div>
          <div class="portal-field">
            <label for="recovery-email">Registered Email Address</label>
            <div class="portal-input-group">
              <span class="portal-input-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m4 7 8 6 8-6"/></svg>
              </span>
              <input id="recovery-email" name="email" type="email" autocomplete="email" placeholder="Registered Email Address" required>
            </div>
          </div>
          <button class="portal-primary-button" type="submit">Reset Link anfordern</button>
          <p class="portal-form-status" id="recovery-status" role="status" aria-live="polite"></p>
        </form>
        <p class="portal-back-link"><a href="online-banking.html">Back to Sign in</a></p>
      </section>
    </div>
  </main>
  <footer class="site-footer" id="global-footer"></footer>
  <script src="script.js"></script>
  <script src="portal.js"></script>
</body>
</html>
